<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LoopHole Studios</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1e293b] text-white min-h-screen flex flex-col items-center justify-between p-6 select-none font-sans">

  <!-- Header -->
  <header class="w-full max-w-md flex justify-between items-center py-4 border-b border-slate-700">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-amber-400 border-2 border-amber-600 flex items-center justify-center text-xl shadow">🌀</div>
      <div>
        <h1 class="text-base font-black tracking-wider text-amber-400 leading-none">LOOPHOLE</h1>
        <p class="text-[10px] font-bold text-slate-400 tracking-widest uppercase">Gaming Studios</p>
      </div>
    </div>
    <span class="text-xs px-2.5 py-1 bg-slate-800 border border-slate-600 rounded-full text-slate-300 font-bold">Hub v1.0</span>
  </header>

  <!-- Games Showcase Grid -->
  <main class="w-full max-w-md my-auto py-8 flex flex-col gap-5">
    <div class="text-left">
      <h2 class="text-xs font-black uppercase tracking-widest text-slate-400">Featured Games</h2>
    </div>

    <!-- Game Card: Bhaag Buggu -->
    <div class="bg-gradient-to-b from-stone-800 to-stone-900 border-2 border-stone-700 rounded-3xl p-5 shadow-2xl flex flex-col items-center text-center">
      <div class="w-24 h-24 rounded-full bg-[#e5dec9] border-4 border-amber-500 shadow flex items-center justify-center text-4xl mb-4">
        👮‍♂️💰🦹
      </div>
      <h3 class="text-xl font-black text-amber-400 drop-shadow">CATCH THE THIEF</h3>
      <p class="text-xs font-bold text-amber-200/70 tracking-widest uppercase mt-0.5">Bhaag Buggu</p>
      <p class="text-xs text-slate-300 mt-2 px-4 leading-relaxed">
        Corner the thief across dynamic node grids or slip through the red perimeter exits!
      </p>
      <a href="games/bhaag-buggu/index.html" class="w-full mt-5 py-3.5 rounded-2xl text-sm font-black text-white bg-lime-600 hover:bg-lime-500 border-2 border-lime-800 shadow-[0_5px_0_#3f6212] active:translate-y-1 text-center transition-all block">
        ▶ PLAY GAME
      </a>
    </div>

    <!-- Placeholder for Future Games -->
    <div class="border-2 border-dashed border-slate-700 rounded-3xl p-6 flex flex-col items-center text-center text-slate-500">
      <span class="text-3xl mb-1">🎮</span>
      <h4 class="text-xs font-black tracking-wider uppercase text-slate-400">Next Studio Title</h4>
      <p class="text-[11px] text-slate-500 mt-1">Under development by LoopHole Studios</p>
    </div>
  </main>

  <footer class="w-full max-w-md text-center py-3 text-[11px] text-slate-500 border-t border-slate-800">
    © 2026 LoopHole Studios. All rights reserved.
  </footer>

</body>
</html>
