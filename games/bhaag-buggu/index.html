<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bhaag Buggu - LoopHole Studios</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>

  <!-- 1. TITLE SCREEN OVERLAY -->
  <div id="screen-title" style="position:fixed; inset:0; z-index:9999; background:#e5dec9; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:24px 16px; font-family:system-ui, sans-serif; box-sizing:border-box;">
    <div style="width:100%; max-width:320px; display:flex; justify-content:space-between; align-items:center;">
      <a href="../../index.html" style="text-decoration:none; width:40px; height:40px; border-radius:50%; background:#38bdf8; border:2px solid #334155; display:flex; align-items:center; justify-content:center; font-size:18px;">🏠</a>
      <div style="font-size:11px; font-weight:900; letter-spacing:1px; color:#78350f;">LOOPHOLE STUDIOS</div>
      <button id="title-sound-btn" style="width:40px; height:40px; border-radius:50%; background:#f59e0b; border:2px solid #334155; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer;">🔊</button>
    </div>

    <div style="text-align:center;">
      <h1 style="margin:0; font-size:36px; font-weight:900; color:#f59e0b; text-shadow:0 3px 0 #b45309;">CATCH</h1>
      <h2 style="margin:-6px 0 0 0; font-size:30px; font-weight:900; color:#fbbf24; text-shadow:0 3px 0 #92400e;">THE THIEF</h2>
      <div style="font-size:11px; font-weight:700; color:#78350f; letter-spacing:2px; margin-top:4px;">BHAAG BUGGU</div>
    </div>

    <div style="width:200px; height:200px; border-radius:50%; background:#fff; border:4px solid #d6cbaf; display:flex; flex-direction:column; align-items:center; justify-content:center;">
      <div style="font-size:46px; display:flex; align-items:center; gap:4px;">
        <span style="transform:scaleX(-1); display:inline-block;">👮‍♂️</span>
        <span style="font-size:30px;">💰</span>
        <span>🦹</span>
      </div>
      <div style="width:130px; height:10px; background:#e2e8f0; border-radius:10px; margin-top:10px;"></div>
    </div>

    <div style="width:100%; max-width:300px; display:flex; flex-direction:column; gap:12px;">
      <div id="step-mode" style="display:flex; flex-direction:column; gap:10px; width:100%;">
        <button id="btn-start-single" style="width:100%; padding:15px; border-radius:16px; font-size:16px; font-weight:900; color:#fff; background:#65a30d; border:3px solid #365314; box-shadow:0 4px 0 #365314; cursor:pointer;">
          👤 Single Player
        </button>
        <button id="btn-start-pass" style="width:100%; padding:13px; border-radius:14px; font-size:15px; font-weight:900; color:#fff; background:#9333ea; border:3px solid #581c87; box-shadow:0 4px 0 #581c87; cursor:pointer;">
          👥 Pass & Play
        </button>
      </div>

      <div id="step-role" style="display:none; flex-direction:column; gap:10px; width:100%;">
        <button id="btn-role-police" style="width:100%; padding:13px; border-radius:14px; font-size:15px; font-weight:900; color:#fff; background:#0284c7; border:3px solid #075985; box-shadow:0 4px 0 #075985; cursor:pointer;">
          👮‍♂️ Play as Police
        </button>
        <button id="btn-role-thief" style="width:100%; padding:13px; border-radius:14px; font-size:15px; font-weight:900; color:#fff; background:#e11d48; border:3px solid #9f1239; box-shadow:0 4px 0 #9f1239; cursor:pointer;">
          🦹 Play as Buggu
        </button>
        <button id="btn-role-back" style="background:none; border:none; color:#78350f; font-weight:700; font-size:13px; padding:6px; cursor:pointer;">
          ← Back
        </button>
      </div>
    </div>
  </div>

  <!-- 2. GAME HUD -->
  <div style="position:fixed; inset:0; background:#83858c; display:flex; flex-direction:column; justify-content:space-between; align-items:center; overflow:hidden;">
    <header style="width:100%; max-width:420px; padding:10px 14px; background:#0f172a; display:flex; justify-content:space-between; align-items:center; box-sizing:border-box;">
      <div style="display:flex; gap:8px;">
        <button id="btn-open-levels" style="background:#2563eb; color:#fff; border:none; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer;">
          🗺️ <span id="level-label">Level 1</span>
        </button>
        <button id="btn-go-home" style="background:#334155; color:#fff; border:none; padding:6px 10px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer;">
          🏠 Menu
        </button>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <div id="turn-indicator" style="font-size:11px; font-weight:900; padding:4px 8px; border-radius:6px; background:#1e3a8a; color:#93c5fd; border:1px solid #3b82f6;">
          POLICE TURN
        </div>
        <button id="btn-sound-game" style="background:none; border:none; font-size:16px; cursor:pointer;">🔊</button>
      </div>
    </header>

    <main style="position:relative; width:100%; max-width:420px; flex:1; display:flex; align-items:center; justify-content:center;">
      <canvas id="gameCanvas"></canvas>
      <div style="position:absolute; bottom:8px; background:rgba(0,0,0,0.6); color:#e2e8f0; font-size:11px; padding:4px 10px; border-radius:20px; pointer-events:none;">
        Tap token, then tap connected ring
      </div>
    </main>

    <footer style="width:100%; max-width:420px; padding:12px 14px; background:#0f172a; display:flex; gap:10px; box-sizing:border-box;">
      <button id="btn-undo" style="flex:1; padding:10px; border-radius:10px; font-size:13px; font-weight:700; color:#fff; background:#d97706; border:none; cursor:pointer;">↩️ Undo</button>
      <button id="btn-restart" style="flex:1; padding:10px; border-radius:10px; font-size:13px; font-weight:700; color:#fff; background:#e11d48; border:none; cursor:pointer;">🔄 Restart</button>
    </footer>
  </div>

  <!-- 3. LEVEL MODAL -->
  <div id="modal-levels" style="display:none; position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; padding:16px;">
    <div style="width:100%; max-width:300px; background:#1e293b; border-radius:16px; padding:16px; display:flex; flex-direction:column; border:1px solid #475569;">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:8px;">
        <span style="font-weight:700; font-size:14px; color:#fff;">Select Arena</span>
        <button id="btn-close-levels" style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">✕</button>
      </div>
      <div id="levels-grid" style="display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; padding-top:14px;"></div>
    </div>
  </div>

  <!-- 4. WIN / LOSS MODAL -->
  <div id="modal-gameover" style="display:none; position:fixed; inset:0; z-index:10000; background:#e5dec9; flex-direction:column; align-items:center; justify-content:space-between; padding:36px 16px; box-sizing:border-box;">
    <div style="padding:6px 30px; border-radius:8px; background:#facc15; border:3px solid #713f12; box-shadow:0 3px 0 #713f12;">
      <span style="font-size:22px; font-weight:900; color:#451a03; letter-spacing:2px;">WIN</span>
    </div>
    <div style="width:200px; height:200px; border-radius:50%; background:#fff; border:4px solid #d6cbaf; display:flex; flex-direction:column; align-items:center; justify-content:center;">
      <div id="end-art-police" style="font-size:42px; display:flex; align-items:center; gap:6px;">
        <span style="font-size:32px;">😭</span><span>🔗</span><span>👮‍♂️</span>
      </div>
      <div id="end-art-thief" style="display:none; font-size:42px; align-items:center; gap:6px;">
        <span>🦹</span><span style="font-size:28px;">💰</span><span style="font-size:32px;">😵‍💫</span>
      </div>
      <div style="width:130px; height:8px; background:#e2e8f0; border-radius:10px; margin-top:10px;"></div>
    </div>
    <div style="width:100%; max-width:280px; text-align:center; display:flex; flex-direction:column; gap:12px;">
      <div>
        <h3 id="end-title" style="margin:0; font-size:24px; font-weight:900; color:#451a03;">Police wins</h3>
        <p id="end-subtitle" style="margin:4px 0 0 0; font-size:12px; font-weight:600; color:#78350f;">Buggu is trapped!</p>
      </div>
      <div id="end-actions" style="display:flex; gap:10px; width:100%;"></div>
    </div>
  </div>

  <!-- LOAD MODULAR ENGINES -->
  <script src="../../shared/js/audio-kit.js"></script>
  <script src="js/arenas.js"></script>
  <script src="js/engine.js"></script>
</body>
</html>
